name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 升级到最新 LTS/Stable 版本
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 使用 ci 确保完全一致的依赖环境

      - name: Build
        run: npm run build

      - name: Post Build (Handle SPA Routing)
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
