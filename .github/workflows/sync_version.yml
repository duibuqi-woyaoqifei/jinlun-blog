name: Sync Version From App

on:
  repository_dispatch:
    types: [version_update]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 从 dispatch 的 client_payload 读取数据（Rbook 发送的是小写 version / url）
      VERSION: ${{ github.event.client_payload.version }}
      URL: ${{ github.event.client_payload.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update apps.json (rbook / unzip-pro version and link)
        run: |
          if [ -z "$VERSION" ] || [ -z "$URL" ]; then
            echo "::error::缺少 VERSION(=${VERSION:-empty}) 或 URL(=${URL:-empty})，忽略本次更新"
            exit 1
          fi
          echo "更新 rbook / unzip-pro -> version=$VERSION, link=$URL"

          # 使用 jq --arg 传参，避免把变量拼进过滤表达式（更稳健）
          cat public/api/v1/apps.json | jq \
            --arg v "$VERSION" \
            --arg u "$URL" \
            'map(
              if .id == "unzip-pro" or .id == "rbook" then
                .version = $v |
                .link = $u |
                .update_config.latest_version = $v
              else . end
            )' > apps_tmp.json
          mv apps_tmp.json public/api/v1/apps.json
          git diff --stat public/api/v1/apps.json

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/api/v1/apps.json
          if git diff --quiet --cached; then
            echo "apps.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto update rbook/unzip-pro to v$VERSION"
          git push origin main