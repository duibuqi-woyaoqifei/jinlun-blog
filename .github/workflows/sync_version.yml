name: Sync Version From App

on:
  repository_dispatch:
    types: [version_update]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
          # 精准修改 unzip-pro 或 rbook 的版本和链接
          # 使用 jq 的 map 逻辑确保结构稳健
          cat public/api/v1/apps.json | jq "map(
            if .id == \"unzip-pro\" or .id == \"rbook\" then 
              .version = \"$VERSION\" | 
              .link = \"$URL\" | 
              .update_config.latest_version = \"$VERSION\" 
            else . end
          )" > apps_tmp.json
          mv apps_tmp.json public/api/v1/apps.json
          
      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/api/v1/apps.json
          git commit -m "chore: auto update unzip-pro to v${{ github.event.client_payload.version }}"
          git push origin main
